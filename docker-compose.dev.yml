# ============================================
# 愈己CareMe工作室 - Development Docker Compose
# ============================================
# Usage: docker-compose -f docker-compose.dev.yml up -d
#
# This starts MySQL and MinIO for local development.
# Run backend locally with: npm run dev
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: pilates-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pilates_studio
      MYSQL_USER: pilates
      MYSQL_PASSWORD: pilates123
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pilates-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_dev_data:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_dev_data:
  minio_dev_data:
