# ============================================
# 愈己CareMe工作室 - Production Docker Compose
# ============================================
# Usage:
#   cp backend/.env.example backend/.env
#   # Edit backend/.env with production values
#   docker-compose up -d
#
# Services:
#   - mysql:     Database
#   - backend:   NestJS API server
#   - admin:     Nginx serving admin frontend (optional, build first)
#
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: pilates-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: pilates_studio
      MYSQL_USER: pilates
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pilates-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pilates-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-300000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_TEMPLATE_ID_BOOKING_CONFIRMATION: ${WECHAT_TEMPLATE_ID_BOOKING_CONFIRMATION:-}
      WECHAT_TEMPLATE_ID_BOOKING_CANCELLED: ${WECHAT_TEMPLATE_ID_BOOKING_CANCELLED:-}
      WECHAT_TEMPLATE_ID_BOOKING_REMINDER: ${WECHAT_TEMPLATE_ID_BOOKING_REMINDER:-}
      WECHAT_TEMPLATE_ID_ATTENDANCE_CHECKED_IN: ${WECHAT_TEMPLATE_ID_ATTENDANCE_CHECKED_IN:-}
      WECHAT_TEMPLATE_ID_MEMBERSHIP_EXPIRY: ${WECHAT_TEMPLATE_ID_MEMBERSHIP_EXPIRY:-}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_MOCK: ${WECHAT_PAY_MOCK:-false}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${WECHAT_PAY_MERCHANT_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ANALYTICS_MONTHLY_REVENUE_GOAL_CENTS: ${ANALYTICS_MONTHLY_REVENUE_GOAL_CENTS:-5000000}
      NOTIFICATION_EXPIRY_REMINDER_DAYS: ${NOTIFICATION_EXPIRY_REMINDER_DAYS:-3}
      NOTIFICATION_BOOKING_REMINDER_MINUTES: ${NOTIFICATION_BOOKING_REMINDER_MINUTES:-60}
      NOTIFICATION_PROCESSING_BATCH_SIZE: ${NOTIFICATION_PROCESSING_BATCH_SIZE:-50}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pilates.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MINI_OPEN_ID: ${SEED_MINI_OPEN_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - pilates-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  admin:
    image: nginx:alpine
    container_name: pilates-admin
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - pilates-network

volumes:
  mysql_data:
  backend_logs:

networks:
  pilates-network:
    driver: bridge
